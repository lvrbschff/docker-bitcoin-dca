l="#0c1425" stroke="#26324a"/><text x="1021.5" y="1495" font-size="12" fill="#9ba9c4">Last updated</text><text x="1021.5" y="1527" font-size="22" fill="#edf2ff" font-weight="700">12:00:00</text><rect x="152" y="1655" width="1136" height="390" rx="14" fill="#121a2d" stroke="#26324a"/><text x="172" y="1689" font-size="17" fill="#edf2ff" font-weight="700">Activity</text><text x="1050" y="1688" font-size="12" fill="#9ba9c4">Entries per page</text><rect x="1184" y="1667" width="84" height="36" rx="9" fill="#0c1425" stroke="#26324a"/><text x="1201" y="1690" font-size="13" fill="#edf2ff">20</text><path d="M1247 1685l4 4 4-4" fill="none" stroke="#9ba9c4" stroke-width="1.5"/><text x="182" y="1733" font-size="11" fill="#9ba9c4" font-weight="700">DATE</text><text x="410" y="1733" font-size="11" fill="#9ba9c4" font-weight="700">TYPE</text><text x="582" y="1733" font-size="11" fill="#9ba9c4" font-weight="700">BTC</text><text x="725" y="1733" font-size="11" fill="#9ba9c4" font-weight="700">PRICE</text><text x="903" y="1733" font-size="11" fill="#9ba9c4" font-weight="700">VALUE</text><text x="1042" y="1733" font-size="11" fill="#9ba9c4" font-weight="700">FEE</text><text x="1158" y="1733" font-size="11" fill="#9ba9c4" font-weight="700">ACTION</text><path d="M172 1746H1268" stroke="#26324a"/><text x="182" y="1778" font-size="13" fill="#edf2ff">27/10/2026, 11:00:00</text><text x="410" y="1778" font-size="13" fill="#edf2ff">Buy</text><text x="582" y="1778" font-size="13" fill="#edf2ff">0.001 BTC</text><text x="725" y="1778" font-size="13" fill="#edf2ff">€81,000.00/BTC</text><text x="903" y="1778" font-size="13" fill="#edf2ff">€81.00</text><text x="1042" y="1778" font-size="13" fill="#edf2ff">€0.20</text><rect x="1154" y="1757" width="72" height="31" rx="8" fill="#0c1425" stroke="#26324a"/><text x="1165" y="1778" font-size="13" fill="#edf2ff">Delete</text><path d="M172 1791H1268" stroke="#26324a"/><text x="182" y="1821" font-size="13" fill="#edf2ff">23/10/2026, 14:00:00</text><text x="410" y="1821" font-size="13" fill="#edf2ff">Withdrawal</text><text x="582" y="1821" font-size="13" fill="#edf2ff">0.0044 BTC</text><text x="725" y="1821" font-size="13" fill="#edf2ff">€81,000.00/BTC</text><text x="903" y="1821" font-size="13" fill="#edf2ff">€356.40</text><text x="1042" y="1821" font-size="13" fill="#edf2ff">€8.10</text><text x="1158" y="1821" font-size="13" fill="#edf2ff"></text><path d="M172 1834H1268" stroke="#26324a"/><text x="182" y="1864" font-size="13" fill="#edf2ff">22/10/2026, 12:00:00</text><text x="410" y="1864" font-size="13" fill="#edf2ff">Buy</text><text x="582" y="1864" font-size="13" fill="#edf2ff">0.002 BTC</text><text x="725" y="1864" font-size="13" fill="#edf2ff">€78,000.00/BTC</text><text x="903" y="1864" font-size="13" fill="#edf2ff">€156.00</text><text x="1042" y="1864" font-size="13" fill="#edf2ff">€0.39</text><rect x="1154" y="1843" width="72" height="31" rx="8" fill="#0c1425" stroke="#26324a"/><text x="1165" y="1864" font-size="13" fill="#edf2ff">Delete</text><path d="M172 1877H1268" stroke="#26324a"/><text x="182" y="1907" font-size="13" fill="#edf2ff">21/10/2026, 12:00:00</text><text x="410" y="1907" font-size="13" fill="#edf2ff">Buy</text><text x="582" y="1907" font-size="13" fill="#edf2ff">0.0015 BTC</text><text x="725" y="1907" font-size="13" fill="#edf2ff">€82,000.00/BTC</text><text x="903" y="1907" font-size="13" fill="#edf2ff">€123.00</text><text x="1042" y="1907" font-size="13" fill="#edf2ff">€0.31</text><rect x="1154" y="1886" width="72" height="31" rx="8" fill="#0c1425" stroke="#26324a"/><text x="1165" y="1907" font-size="13" fill="#edf2ff">Delete</text><path d="M172 1920H1268" stroke="#26324a"/><text x="182" y="1950" font-size="13" fill="#edf2ff">20/10/2026, 12:00:00</text><text x="410" y="1950" font-size="13" fill="#edf2ff">Buy</text><text x="582" y="1950" font-size="13" fill="#edf2ff">0.001 BTC</text><text x="725" y="1950" font-size="13" fill="#edf2ff">€80,000.00/BTC</text><text x="903" y="1950" font-size="13" fill="#edf2ff">€80.00</text><text x="1042" y="1950" font-size="13" fill="#edf2ff">€0.20</text><rect x="1154" y="1929" width="72" height="31" rx="8" fill="#0c1425" stroke="#26324a"/><text x="1165" y="1950" font-size="13" fill="#edf2ff">Delete</text><path d="M172 1963H1268" stroke="#26324a"/><rect x="172" y="1987" width="99" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="192.5" y="2015" font-size="15" fill="#edf2ff">Previous</text><text x="595.0" y="2015" font-size="13" fill="#9ba9c4">Showing 1–5 of 5 · Page 1 of 1</text><rect x="1194" y="1987" width="74" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="1215.5" y="2015" font-size="15" fill="#edf2ff">Next</text><rect x="1079" y="2063" width="209" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="1110.0" y="2091" font-size="15" fill="#edf2ff">Download Parqet CSV</text><path d="M152 2138H1288" stroke="#26324a"/><text x="152" y="2172" font-size="17" fill="#edf2ff" font-weight="700">Notes</text><text x="152" y="2203" font-size="12" fill="#9ba9c4">1.</text><text x="173" y="2203" font-size="12" fill="#edf2ff" font-weight="700">Display currency and price data.</text><text x="173" y="2223" font-size="12" fill="#9ba9c4">Fiat values are converted to the selected display currency. The current BTC price is fetched from Kraken’s public BTC-to-fiat pages when the report loads. Parqet CSV exports use EUR.</text><text x="152" y="2257" font-size="12" fill="#9ba9c4">2.</text><text x="173" y="2257" font-size="12" fill="#edf2ff" font-weight="700">Purchase schedule.</text><text x="173" y="2277" font-size="12" fill="#9ba9c4">The interval is the time until the next deposit day divided by the estimated number of purchases the current balance can cover, using the current market price and configured purchase amount or exchange</text><text x="173" y="2297" font-size="12" fill="#9ba9c4">minimum. Time elapsed since the last purchase is deducted to determine the next purchase time. The estimate is recalculated during bot checks; open or unconfirmed orders block further purchases.</text><text x="152" y="2331" font-size="12" fill="#9ba9c4">3.</text><text x="173" y="2331" font-size="12" fill="#edf2ff" font-weight="700">Period analysis, Parqet export and local activity history.</text><text x="173" y="2351" font-size="12" fill="#9ba9c4">These notes apply to the date filters in Period analysis, the Activity table and the Download Parqet CSV button. Choose an interval between bot-recorded BTC withdrawals or set a custom date range. The</text><text x="173" y="2371" font-size="12" fill="#9ba9c4">Parqet CSV consolidates the period into one purchase: all real purchase costs and trading fees in EUR, and net BTC received at withdrawals after network fees. The period must contain purchases and a</text><text x="173" y="2391" font-size="12" fill="#9ba9c4">bot-recorded withdrawal. Dry-run purchases are shown separately and excluded from the CSV. Delete removes a purchase from local history only; it cannot reverse an exchange order.</text><text x="152" y="2425" font-size="12" fill="#9ba9c4">4.</text><text x="173" y="2425" font-size="12" fill="#edf2ff" font-weight="700">Manual BTC withdrawal.</text><text x="173" y="2445" font-size="12" fill="#9ba9c4">Kraken saved withdrawal method: Example Bitcoin wallet (fictional)</text><text x="173" y="2465" font-size="12" fill="#9ba9c4">The button withdraws the entire available BTC balance, less the exchange withdrawal fee. LIVE_TRADING must be enabled; automatic withdrawals may remain disabled and their threshold does not apply.</text><text x="173" y="2485" font-size="12" fill="#9ba9c4">Configure KRAKEN_WITHDRAW_KEY in .env for Kraken, or WITHDRAW_ADDRESS and WITHDRAW_NETWORK for Bitvavo. Kraken resolves the saved method to its destination address. A confirmation is</text><text x="173" y="2505" font-size="12" fill="#9ba9c4">required before submission. Submitted manual withdrawals appear in Activity and count toward Parqet exports like automatic withdrawals.</text><text x="152" y="2539" font-size="12" fill="#9ba9c4">5.</text><text x="173" y="2539" font-size="12" fill="#edf2ff" font-weight="700">Local access only.</text><text x="173" y="2559" font-size="12" fill="#9ba9c4">With the default Docker Compose port mapping, the dashboard is accessible only from the Docker host.</text>
</svg>
