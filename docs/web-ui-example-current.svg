<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2433" viewBox="0 0 1440 2433" role="img" aria-labelledby="title desc">
<title id="title">Bitcoin DCA Bot — current web UI illustration</title>
<desc id="desc">Illustration of the current dashboard using fictional data: manual withdrawal below Log out, bot configuration, purchase schedule with current Bitcoin price, period analysis, activity table, Parqet export and configuration footnotes. This is not a live account screenshot.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="1440" height="2433" fill="#0b1020"/>
<text x="152" y="112" font-size="30" fill="#edf2ff" font-weight="700">Bitcoin DCA Bot</text><text x="152" y="141" font-size="15" fill="#9ba9c4">Portfolio overview, bot configuration and activity analysis, with optional Parqet CSV export</text><rect x="1195" y="36" width="93" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="1217.5" y="64" font-size="15" fill="#edf2ff">Log out</text><rect x="1050" y="91" width="238" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="1090.0" y="119" font-size="15" fill="#edf2ff">Withdraw BTC manually</text><text x="1268" y="106" font-size="11" fill="#fff">4</text><text x="1118" y="164" font-size="12" fill="#9ba9c4">Display currency</text><rect x="1118" y="174" width="170" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="1131" y="202" font-size="15" fill="#edf2ff">Euro (EUR)</text><path d="M1267 197l4 4 4-4" fill="none" stroke="#9ba9c4" stroke-width="1.5"/><rect x="152" y="245" width="1136" height="298" rx="14" fill="#121a2d" stroke="#26324a"/><text x="172" y="279" font-size="17" fill="#edf2ff" font-weight="700">Bot configuration</text><rect x="172.0" y="300" width="263.5" height="104" rx="14" fill="#0c1425" stroke="#26324a"/><text x="189.0" y="328" font-size="12" fill="#9ba9c4">Exchange</text><text x="189.0" y="360" font-size="22" fill="#edf2ff" font-weight="700">Kraken</text><rect x="449.5" y="300" width="263.5" height="104" rx="14" fill="#0c1425" stroke="#26324a"/><text x="466.5" y="328" font-size="12" fill="#9ba9c4">Quote currency</text><text x="466.5" y="360" font-size="22" fill="#edf2ff" font-weight="700">EUR</text><rect x="727.0" y="300" width="263.5" height="104" rx="14" fill="#0c1425" stroke="#26324a"/><text x="744.0" y="328" font-size="12" fill="#9ba9c4">Trading mode</text><text x="744.0" y="360" font-size="22" fill="#edf2ff" font-weight="700">Live</text><rect x="1004.5" y="300" width="263.5" height="104" rx="14" fill="#0c1425" stroke="#26324a"/><text x="1021.5" y="328" font-size="12" fill="#9ba9c4">Purchase amount</text><text x="1021.5" y="360" font-size="22" fill="#edf2ff" font-weight="700">Exchange minimum</text><rect x="172.0" y="418" width="263.5" height="104" rx="14" fill="#0c1425" stroke="#26324a"/><text x="189.0" y="446" font-size="12" fill="#9ba9c4">Deposit day (day of month)</text><text x="189.0" y="478" font-size="22" fill="#edf2ff" font-weight="700">1</text><rect x="449.5" y="418" width="263.5" height="104" rx="14" fill="#0c1425" stroke="#26324a"/><text x="466.5" y="446" font-size="12" fill="#9ba9c4">Automatic withdrawals</text><text x="466.5" y="478" font-size="22" fill="#edf2ff" font-weight="700">Enabled</text><rect x="727.0" y="418" width="263.5" height="104" rx="14" fill="#0c1425" stroke="#26324a"/><text x="744.0" y="446" font-size="12" fill="#9ba9c4">Withdrawal threshold</text><text x="744.0" y="478" font-size="22" fill="#edf2ff" font-weight="700">€1,000.00</text><text x="744.0" y="498" font-size="12" fill="#9ba9c4">Threshold in EUR, shown in EUR</text><rect x="152" y="561" width="1136" height="180" rx="14" fill="#121a2d" stroke="#26324a"/><text x="172" y="595" font-size="17" fill="#edf2ff" font-weight="700">Purchase schedule</text><text x="327.0" y="590" font-size="11" fill="#fff" font-weight="700">2</text><rect x="172.0" y="616" width="356.0" height="102" rx="14" fill="#0c1425" stroke="#26324a"/><text x="189.0" y="644" font-size="12" fill="#9ba9c4">Current BTC price</text><text x="291.0" y="639" font-size="9" fill="#fff">1</text><text x="189.0" y="676" font-size="22" fill="#edf2ff" font-weight="700">€84,000.00/BTC</text><text x="189.0" y="696" font-size="12" fill="#9ba9c4">Kraken public price page · fetched 12:00:00</text><rect x="542.0" y="616" width="356.0" height="102" rx="14" fill="#0c1425" stroke="#26324a"/><text x="559.0" y="644" font-size="12" fill="#9ba9c4">Next purchase</text><text x="559.0" y="676" font-size="16" fill="#edf2ff" font-weight="700">28/10/2026, 14:34:56 CET</text><text x="559.0" y="696" font-size="12" fill="#9ba9c4">Scheduled</text><rect x="912.0" y="616" width="356.0" height="102" rx="14" fill="#0c1425" stroke="#26324a"/><text x="929.0" y="644" font-size="12" fill="#9ba9c4">Time until next purchase</text><text x="929.0" y="676" font-size="20" fill="#edf2ff" font-weight="700">02h 34m 56s</text><text x="929.0" y="696" font-size="12" fill="#9ba9c4">Updates every second</text><path d="M152 779H1288" stroke="#26324a"/><text x="152" y="827" font-size="21" fill="#edf2ff" font-weight="700">Period analysis</text><text x="314.0" y="818" font-size="11" fill="#fff" font-weight="700">3</text><text x="152" y="854" font-size="14" fill="#9ba9c4">Choose a custom date range or an interval between withdrawals to review activity and prepare a Parqet export.</text><rect x="152" y="879" width="1136" height="119" rx="14" fill="#121a2d" stroke="#26324a"/><text x="172" y="911" font-size="12" fill="#9ba9c4">Date range</text><rect x="172" y="921" width="265" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="184" y="950" font-size="15" fill="#edf2ff">Custom date range</text><text x="449" y="911" font-size="12" fill="#9ba9c4">From</text><rect x="449" y="921" width="265" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="461" y="950" font-size="15" fill="#edf2ff">20/10/2026, 00:00</text><text x="726" y="911" font-size="12" fill="#9ba9c4">To</text><rect x="726" y="921" width="265" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="738" y="950" font-size="15" fill="#edf2ff">28/10/2026, 12:00</text><path d="M411 943l4 4 4-4" fill="none" stroke="#9ba9c4" stroke-width="1.5"/><rect x="1003" y="921" width="265" height="45" rx="10" fill="#8bafff" stroke="#8bafff"/><text x="1094.5" y="949" font-size="15" fill="#081122" font-weight="700">Load report</text><rect x="152" y="1016" width="1136" height="761" rx="14" fill="#121a2d" stroke="#26324a"/><text x="172" y="1049" font-size="17" fill="#edf2ff" font-weight="700">Selected period summary</text><rect x="172.0" y="1071" width="208.0" height="166" rx="14" fill="#0c1425" stroke="#26324a"/><text x="189.0" y="1099" font-size="12" fill="#9ba9c4">BTC purchases</text><text x="189.0" y="1131" font-size="22" fill="#edf2ff" font-weight="700">4</text><text x="189.0" y="1151" font-size="12" fill="#9ba9c4">0.0055 BTC</text><rect x="394.0" y="1071" width="208.0" height="166" rx="14" fill="#0c1425" stroke="#26324a"/><text x="411.0" y="1099" font-size="12" fill="#9ba9c4">Purchase volume</text><text x="411.0" y="1131" font-size="22" fill="#edf2ff" font-weight="700">€440.00</text><text x="411.0" y="1151" font-size="12" fill="#9ba9c4">Average: €80,000.00/BTC</text><rect x="616.0" y="1071" width="208.0" height="166" rx="14" fill="#0c1425" stroke="#26324a"/><text x="633.0" y="1099" font-size="12" fill="#9ba9c4">Trading fees</text><text x="633.0" y="1131" font-size="22" fill="#edf2ff" font-weight="700">€1.10</text><rect x="838.0" y="1071" width="208.0" height="166" rx="14" fill="#0c1425" stroke="#26324a"/><text x="855.0" y="1099" font-size="12" fill="#9ba9c4">Withdrawals</text><text x="855.0" y="1131" font-size="22" fill="#edf2ff" font-weight="700">0.0044 BTC</text><text x="855.0" y="1151" font-size="12" fill="#9ba9c4">1 confirmed · 0 pending</text><rect x="1060.0" y="1071" width="208.0" height="166" rx="14" fill="#0c1425" stroke="#26324a"/><text x="1077.0" y="1099" font-size="12" fill="#9ba9c4">Withdrawal fees</text><text x="1077.0" y="1131" font-size="22" fill="#edf2ff" font-weight="700">€8.10</text><rect x="172.0" y="1251" width="541.0" height="104" rx="14" fill="#0c1425" stroke="#26324a"/><text x="189.0" y="1279" font-size="12" fill="#9ba9c4">Profit / loss on period purchases</text><text x="189.0" y="1311" font-size="22" fill="#61d7ae" font-weight="700">€20.90</text><text x="189.0" y="1331" font-size="12" fill="#9ba9c4">Current value of BTC bought in this period minus trading fees</text><rect x="727.0" y="1251" width="541.0" height="104" rx="14" fill="#0c1425" stroke="#26324a"/><text x="744.0" y="1279" font-size="12" fill="#9ba9c4">Net BTC in period</text><text x="744.0" y="1311" font-size="22" fill="#edf2ff" font-weight="700">0.001 BTC</text><text x="744.0" y="1331" font-size="12" fill="#9ba9c4">Purchases minus gross BTC withdrawals</text><rect x="172" y="1395" width="1096" height="360" rx="14" fill="#121a2d" stroke="#26324a"/><text x="192" y="1429" font-size="17" fill="#edf2ff" font-weight="700">Activity</text><text x="1030" y="1428" font-size="12" fill="#9ba9c4">Entries per page</text><rect x="1164" y="1407" width="84" height="36" rx="9" fill="#0c1425" stroke="#26324a"/><text x="1181" y="1430" font-size="13" fill="#edf2ff">10</text><path d="M1227 1425l4 4 4-4" fill="none" stroke="#9ba9c4" stroke-width="1.5"/><text x="202" y="1473" font-size="11" fill="#9ba9c4" font-weight="700">DATE</text><text x="430" y="1473" font-size="11" fill="#9ba9c4" font-weight="700">TYPE</text><text x="602" y="1473" font-size="11" fill="#9ba9c4" font-weight="700">BTC</text><text x="745" y="1473" font-size="11" fill="#9ba9c4" font-weight="700">PRICE</text><text x="923" y="1473" font-size="11" fill="#9ba9c4" font-weight="700">VALUE</text><text x="1062" y="1473" font-size="11" fill="#9ba9c4" font-weight="700">FEE</text><text x="1178" y="1473" font-size="11" fill="#9ba9c4" font-weight="700">ACTION</text><path d="M192 1486H1248" stroke="#26324a"/><text x="202" y="1508" font-size="13" fill="#edf2ff">27/10/2026, 11:00:00</text><text x="430" y="1508" font-size="13" fill="#edf2ff">Buy</text><text x="602" y="1508" font-size="13" fill="#edf2ff">0.001 BTC</text><text x="745" y="1508" font-size="13" fill="#edf2ff">€81,000.00/BTC</text><text x="923" y="1508" font-size="13" fill="#edf2ff">€81.00</text><text x="1062" y="1508" font-size="13" fill="#edf2ff">€0.20</text><rect x="1174" y="1490" width="64" height="25" rx="7" fill="#0c1425" stroke="#26324a"/><text x="1183" y="1508" font-size="13" fill="#edf2ff">Delete</text><path d="M192 1521H1248" stroke="#26324a"/><text x="202" y="1543" font-size="13" fill="#edf2ff">23/10/2026, 14:00:00</text><text x="430" y="1543" font-size="13" fill="#edf2ff">Withdrawal · completed</text><text x="602" y="1543" font-size="13" fill="#edf2ff">0.0044 BTC</text><text x="745" y="1543" font-size="13" fill="#edf2ff">€81,000.00/BTC</text><text x="923" y="1543" font-size="13" fill="#edf2ff">€356.40</text><text x="1062" y="1543" font-size="13" fill="#edf2ff">€8.10</text><text x="1178" y="1543" font-size="13" fill="#edf2ff"></text><path d="M192 1556H1248" stroke="#26324a"/><text x="202" y="1578" font-size="13" fill="#edf2ff">22/10/2026, 12:00:00</text><text x="430" y="1578" font-size="13" fill="#edf2ff">Buy</text><text x="602" y="1578" font-size="13" fill="#edf2ff">0.002 BTC</text><text x="745" y="1578" font-size="13" fill="#edf2ff">€78,000.00/BTC</text><text x="923" y="1578" font-size="13" fill="#edf2ff">€156.00</text><text x="1062" y="1578" font-size="13" fill="#edf2ff">€0.39</text><rect x="1174" y="1560" width="64" height="25" rx="7" fill="#0c1425" stroke="#26324a"/><text x="1183" y="1578" font-size="13" fill="#edf2ff">Delete</text><path d="M192 1591H1248" stroke="#26324a"/><text x="202" y="1613" font-size="13" fill="#edf2ff">21/10/2026, 12:00:00</text><text x="430" y="1613" font-size="13" fill="#edf2ff">Buy</text><text x="602" y="1613" font-size="13" fill="#edf2ff">0.0015 BTC</text><text x="745" y="1613" font-size="13" fill="#edf2ff">€82,000.00/BTC</text><text x="923" y="1613" font-size="13" fill="#edf2ff">€123.00</text><text x="1062" y="1613" font-size="13" fill="#edf2ff">€0.31</text><rect x="1174" y="1595" width="64" height="25" rx="7" fill="#0c1425" stroke="#26324a"/><text x="1183" y="1613" font-size="13" fill="#edf2ff">Delete</text><path d="M192 1626H1248" stroke="#26324a"/><text x="202" y="1648" font-size="13" fill="#edf2ff">20/10/2026, 12:00:00</text><text x="430" y="1648" font-size="13" fill="#edf2ff">Buy</text><text x="602" y="1648" font-size="13" fill="#edf2ff">0.001 BTC</text><text x="745" y="1648" font-size="13" fill="#edf2ff">€80,000.00/BTC</text><text x="923" y="1648" font-size="13" fill="#edf2ff">€80.00</text><text x="1062" y="1648" font-size="13" fill="#edf2ff">€0.20</text><rect x="1174" y="1630" width="64" height="25" rx="7" fill="#0c1425" stroke="#26324a"/><text x="1183" y="1648" font-size="13" fill="#edf2ff">Delete</text><path d="M192 1661H1248" stroke="#26324a"/><rect x="192" y="1687" width="99" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="212.5" y="1715" font-size="15" fill="#edf2ff">Previous</text><text x="372" y="1715" font-size="13" fill="#9ba9c4">Showing 1–5 of 5 · Page 1 of 1</text><rect x="908" y="1687" width="74" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="929.5" y="1715" font-size="15" fill="#edf2ff">Next</text><text x="1003" y="1715" font-size="12" fill="#9ba9c4">Go to page</text><rect x="1083" y="1691" width="76" height="36" rx="10" fill="#0c1425" stroke="#26324a"/><text x="1098" y="1715" font-size="13" fill="#edf2ff">1</text><rect x="1178" y="1687" width="70" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="1203.0" y="1715" font-size="15" fill="#edf2ff">Go</text><rect x="1079" y="1793" width="209" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="1110.0" y="1821" font-size="15" fill="#edf2ff">Download Parqet CSV</text><path d="M152 1868H1288" stroke="#26324a"/><text x="152" y="1902" font-size="17" fill="#edf2ff" font-weight="700">Notes</text><text x="152" y="1933" font-size="12" fill="#9ba9c4">1.</text><text x="173" y="1933" font-size="12" fill="#edf2ff" font-weight="700">Display currency and price data.</text><text x="173" y="1953" font-size="12" fill="#9ba9c4">Historical fiat amounts are grouped by their original currency and converted separately to the selected display currency. The current BTC price is fetched from Kraken’s public BTC-to-fiat pages when the</text><text x="173" y="1973" font-size="12" fill="#9ba9c4">report loads. Parqet CSV exports use EUR.</text><text x="152" y="2007" font-size="12" fill="#9ba9c4">2.</text><text x="173" y="2007" font-size="12" fill="#edf2ff" font-weight="700">Purchase schedule.</text><text x="173" y="2027" font-size="12" fill="#9ba9c4">The interval is the time from the last purchase to the next deposit day divided by the estimated number of purchases the current balance can cover, using the current market price and configured purchase</text><text x="173" y="2047" font-size="12" fill="#9ba9c4">amount or exchange minimum. Without a previous purchase, the current time is used. The next purchase is the last purchase time plus this interval; elapsed time only reduces the remaining wait. The</text><text x="173" y="2067" font-size="12" fill="#9ba9c4">estimate is recalculated during bot checks; open or unconfirmed orders block further purchases.</text><text x="152" y="2101" font-size="12" fill="#9ba9c4">3.</text><text x="173" y="2101" font-size="12" fill="#edf2ff" font-weight="700">Period analysis, Parqet export and local activity history.</text><text x="173" y="2121" font-size="12" fill="#9ba9c4">These notes apply to the date filters in Period analysis, the Activity table and the Download Parqet CSV button. Choose an interval between bot-recorded BTC withdrawals or set a custom date range. The</text><text x="173" y="2141" font-size="12" fill="#9ba9c4">Parqet CSV uses the complete interval after the previous confirmed withdrawal through the last confirmed withdrawal in the selected date range. It combines real purchase costs and trading fees in EUR with</text><text x="173" y="2161" font-size="12" fill="#9ba9c4">the ending withdrawal’s net BTC after network fees; later purchases are excluded. The selected range must contain a confirmed withdrawal whose complete interval includes a real purchase. Dry-run</text><text x="173" y="2181" font-size="12" fill="#9ba9c4">purchases are shown separately and excluded from the CSV. Delete removes a purchase from local history only; it cannot reverse an exchange order.</text><text x="152" y="2215" font-size="12" fill="#9ba9c4">4.</text><text x="173" y="2215" font-size="12" fill="#edf2ff" font-weight="700">Manual BTC withdrawal.</text><text x="173" y="2235" font-size="12" fill="#9ba9c4">Kraken saved withdrawal method: Example Bitcoin wallet (fictional)</text><text x="173" y="2255" font-size="12" fill="#9ba9c4">Manual withdrawals are available. Automatic withdrawals may remain disabled.</text><text x="173" y="2275" font-size="12" fill="#9ba9c4">The button withdraws the entire available BTC balance, less the exchange withdrawal fee. LIVE_TRADING must be enabled; automatic withdrawals may remain disabled and their threshold does not apply.</text><text x="173" y="2295" font-size="12" fill="#9ba9c4">Configure KRAKEN_WITHDRAW_KEY in .env for Kraken, or WITHDRAW_ADDRESS and WITHDRAW_NETWORK for Bitvavo. Kraken resolves the saved method to its destination address. A confirmation is</text><text x="173" y="2315" font-size="12" fill="#9ba9c4">required before submission. Submitted manual withdrawals appear in Activity immediately and count toward Parqet exports only after confirmation. Failed or unverified withdrawals are excluded.</text><text x="152" y="2349" font-size="12" fill="#9ba9c4">5.</text><text x="173" y="2349" font-size="12" fill="#edf2ff" font-weight="700">Local access only.</text><text x="173" y="2369" font-size="12" fill="#9ba9c4">With the default Docker Compose port mapping, the dashboard is accessible only from the Docker host.</text>
</svg>
