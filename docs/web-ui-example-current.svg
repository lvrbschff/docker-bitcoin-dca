24a"/><text x="172" y="1677" font-size="17" fill="#edf2ff" font-weight="700">Activity</text><text x="1050" y="1676" font-size="12" fill="#9ba9c4">Entries per page</text><rect x="1184" y="1655" width="84" height="36" rx="9" fill="#0c1425" stroke="#26324a"/><text x="1201" y="1678" font-size="13" fill="#edf2ff">10</text><path d="M1247 1673l4 4 4-4" fill="none" stroke="#9ba9c4" stroke-width="1.5"/><text x="182" y="1721" font-size="11" fill="#9ba9c4" font-weight="700">DATE</text><text x="410" y="1721" font-size="11" fill="#9ba9c4" font-weight="700">TYPE</text><text x="582" y="1721" font-size="11" fill="#9ba9c4" font-weight="700">BTC</text><text x="725" y="1721" font-size="11" fill="#9ba9c4" font-weight="700">PRICE</text><text x="903" y="1721" font-size="11" fill="#9ba9c4" font-weight="700">VALUE</text><text x="1042" y="1721" font-size="11" fill="#9ba9c4" font-weight="700">FEE</text><text x="1158" y="1721" font-size="11" fill="#9ba9c4" font-weight="700">ACTION</text><path d="M172 1734H1268" stroke="#26324a"/><text x="182" y="1756" font-size="13" fill="#edf2ff">27/10/2026, 11:00:00</text><text x="410" y="1756" font-size="13" fill="#edf2ff">Buy</text><text x="582" y="1756" font-size="13" fill="#edf2ff">0.001 BTC</text><text x="725" y="1756" font-size="13" fill="#edf2ff">€81,000.00/BTC</text><text x="903" y="1756" font-size="13" fill="#edf2ff">€81.00</text><text x="1042" y="1756" font-size="13" fill="#edf2ff">€0.20</text><rect x="1154" y="1738" width="64" height="25" rx="7" fill="#0c1425" stroke="#26324a"/><text x="1163" y="1756" font-size="13" fill="#edf2ff">Delete</text><path d="M172 1769H1268" stroke="#26324a"/><text x="182" y="1791" font-size="13" fill="#edf2ff">23/10/2026, 14:00:00</text><text x="410" y="1791" font-size="13" fill="#edf2ff">Withdrawal · completed</text><text x="582" y="1791" font-size="13" fill="#edf2ff">0.0044 BTC</text><text x="725" y="1791" font-size="13" fill="#edf2ff">€81,000.00/BTC</text><text x="903" y="1791" font-size="13" fill="#edf2ff">€356.40</text><text x="1042" y="1791" font-size="13" fill="#edf2ff">€8.10</text><text x="1158" y="1791" font-size="13" fill="#edf2ff"></text><path d="M172 1804H1268" stroke="#26324a"/><text x="182" y="1826" font-size="13" fill="#edf2ff">22/10/2026, 12:00:00</text><text x="410" y="1826" font-size="13" fill="#edf2ff">Buy</text><text x="582" y="1826" font-size="13" fill="#edf2ff">0.002 BTC</text><text x="725" y="1826" font-size="13" fill="#edf2ff">€78,000.00/BTC</text><text x="903" y="1826" font-size="13" fill="#edf2ff">€156.00</text><text x="1042" y="1826" font-size="13" fill="#edf2ff">€0.39</text><rect x="1154" y="1808" width="64" height="25" rx="7" fill="#0c1425" stroke="#26324a"/><text x="1163" y="1826" font-size="13" fill="#edf2ff">Delete</text><path d="M172 1839H1268" stroke="#26324a"/><text x="182" y="1861" font-size="13" fill="#edf2ff">21/10/2026, 12:00:00</text><text x="410" y="1861" font-size="13" fill="#edf2ff">Buy</text><text x="582" y="1861" font-size="13" fill="#edf2ff">0.0015 BTC</text><text x="725" y="1861" font-size="13" fill="#edf2ff">€82,000.00/BTC</text><text x="903" y="1861" font-size="13" fill="#edf2ff">€123.00</text><text x="1042" y="1861" font-size="13" fill="#edf2ff">€0.31</text><rect x="1154" y="1843" width="64" height="25" rx="7" fill="#0c1425" stroke="#26324a"/><text x="1163" y="1861" font-size="13" fill="#edf2ff">Delete</text><path d="M172 1874H1268" stroke="#26324a"/><text x="182" y="1896" font-size="13" fill="#edf2ff">20/10/2026, 12:00:00</text><text x="410" y="1896" font-size="13" fill="#edf2ff">Buy</text><text x="582" y="1896" font-size="13" fill="#edf2ff">0.001 BTC</text><text x="725" y="1896" font-size="13" fill="#edf2ff">€80,000.00/BTC</text><text x="903" y="1896" font-size="13" fill="#edf2ff">€80.00</text><text x="1042" y="1896" font-size="13" fill="#edf2ff">€0.20</text><rect x="1154" y="1878" width="64" height="25" rx="7" fill="#0c1425" stroke="#26324a"/><text x="1163" y="1896" font-size="13" fill="#edf2ff">Delete</text><path d="M172 1909H1268" stroke="#26324a"/><rect x="172" y="1935" width="99" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="192.5" y="1963" font-size="15" fill="#edf2ff">Previous</text><text x="352" y="1963" font-size="13" fill="#9ba9c4">Showing 1–5 of 5 · Page 1 of 1</text><rect x="928" y="1935" width="74" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="949.5" y="1963" font-size="15" fill="#edf2ff">Next</text><text x="1023" y="1963" font-size="12" fill="#9ba9c4">Go to page</text><rect x="1103" y="1939" width="76" height="36" rx="10" fill="#0c1425" stroke="#26324a"/><text x="1118" y="1963" font-size="13" fill="#edf2ff">1</text><rect x="1198" y="1935" width="70" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="1223.0" y="1963" font-size="15" fill="#edf2ff">Go</text><rect x="1079" y="2021" width="209" height="45" rx="10" fill="#0c1425" stroke="#26324a"/><text x="1110.0" y="2049" font-size="15" fill="#edf2ff">Download Parqet CSV</text><path d="M152 2096H1288" stroke="#26324a"/><text x="152" y="2130" font-size="17" fill="#edf2ff" font-weight="700">Notes</text><text x="152" y="2161" font-size="12" fill="#9ba9c4">1.</text><text x="173" y="2161" font-size="12" fill="#edf2ff" font-weight="700">Display currency and price data.</text><text x="173" y="2181" font-size="12" fill="#9ba9c4">Historical fiat amounts are grouped by their original currency and converted separately to the selected display currency. The current BTC price is fetched from Kraken’s public BTC-to-fiat pages when the</text><text x="173" y="2201" font-size="12" fill="#9ba9c4">report loads. Parqet CSV exports use EUR.</text><text x="152" y="2235" font-size="12" fill="#9ba9c4">2.</text><text x="173" y="2235" font-size="12" fill="#edf2ff" font-weight="700">Purchase schedule.</text><text x="173" y="2255" font-size="12" fill="#9ba9c4">The interval is the time until the next deposit day divided by the estimated number of purchases the current balance can cover, using the current market price and configured purchase amount or exchange</text><text x="173" y="2275" font-size="12" fill="#9ba9c4">minimum. Time elapsed since the last purchase is deducted to determine the next purchase time. The estimate is recalculated during bot checks; open or unconfirmed orders block further purchases.</text><text x="152" y="2309" font-size="12" fill="#9ba9c4">3.</text><text x="173" y="2309" font-size="12" fill="#edf2ff" font-weight="700">Period analysis, Parqet export and local activity history.</text><text x="173" y="2329" font-size="12" fill="#9ba9c4">These notes apply to the date filters in Period analysis, the Activity table and the Download Parqet CSV button. Choose an interval between bot-recorded BTC withdrawals or set a custom date range. The</text><text x="173" y="2349" font-size="12" fill="#9ba9c4">Parqet CSV consolidates the period into one purchase: all real purchase costs and trading fees in EUR, and net BTC from confirmed withdrawals after network fees. The period must contain purchases and a</text><text x="173" y="2369" font-size="12" fill="#9ba9c4">bot-recorded withdrawal. Dry-run purchases are shown separately and excluded from the CSV. Delete removes a purchase from local history only; it cannot reverse an exchange order.</text><text x="152" y="2403" font-size="12" fill="#9ba9c4">4.</text><text x="173" y="2403" font-size="12" fill="#edf2ff" font-weight="700">Manual BTC withdrawal.</text><text x="173" y="2423" font-size="12" fill="#9ba9c4">Kraken saved withdrawal method: Example Bitcoin wallet (fictional)</text><text x="173" y="2443" font-size="12" fill="#9ba9c4">Manual withdrawals are available. Automatic withdrawals may remain disabled.</text><text x="173" y="2463" font-size="12" fill="#9ba9c4">The button withdraws the entire available BTC balance, less the exchange withdrawal fee. LIVE_TRADING must be enabled; automatic withdrawals may remain disabled and their threshold does not apply.</text><text x="173" y="2483" font-size="12" fill="#9ba9c4">Configure KRAKEN_WITHDRAW_KEY in .env for Kraken, or WITHDRAW_ADDRESS and WITHDRAW_NETWORK for Bitvavo. Kraken resolves the saved method to its destination address. A confirmation is</text><text x="173" y="2503" font-size="12" fill="#9ba9c4">required before submission. Submitted manual withdrawals appear in Activity immediately and count toward Parqet exports only after confirmation. Failed or unverified withdrawals are excluded.</text><text x="152" y="2537" font-size="12" fill="#9ba9c4">5.</text><text x="173" y="2537" font-size="12" fill="#edf2ff" font-weight="700">Local access only.</text><text x="173" y="2557" font-size="12" fill="#9ba9c4">With the default Docker Compose port mapping, the dashboard is accessible only from the Docker host.</text>
</svg>
