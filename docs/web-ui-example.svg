<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1300" viewBox="0 0 1440 1300" role="img" aria-labelledby="title desc">
<title id="title">Bitcoin DCA Bot dashboard example</title>
<desc id="desc">Illustrative dark dashboard with fictional Bitcoin purchases, fees, portfolio values, settings, and activity records.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111a2d"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
  <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#151f34"/><stop offset="1" stop-color="#0f1627"/></linearGradient>
  <style>
    text{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;fill:#edf2ff}
    .muted{fill:#9ba9c4}.accent{fill:#8bafff}.green{fill:#61d7ae}
    .eyebrow{font-size:14px;font-weight:700;letter-spacing:2px}
    .title{font-size:34px;font-weight:750}
    .sub{font-size:15px}
    .h2{font-size:19px;font-weight:700}
    .label{font-size:13px;fill:#9ba9c4}
    .value{font-size:25px;font-weight:700}
    .small{font-size:12px;fill:#9ba9c4}
    .panel{fill:url(#panel);stroke:#26324a;stroke-width:1.5}
    .card{fill:#0c1425;stroke:#26324a;stroke-width:1.2}
    .line{stroke:#26324a;stroke-width:1}
  </style>
</defs>
<rect width="1440" height="1300" rx="22" fill="url(#bg)"/>
<rect x="24" y="24" width="1392" height="1252" rx="22" fill="#0b1020"/>
<!-- Header -->
<text x="68" y="70" class="eyebrow accent">KRAKEN</text>
<text x="68" y="116" class="title">Bitcoin DCA Bot</text>
<text x="68" y="146" class="sub muted">Portfolio overview and activity analysis, with optional Parqet CSV export</text>
<rect x="1190" y="53" width="160" height="34" rx="17" fill="#10182a" stroke="#26324a"/>
<text x="1270" y="75" text-anchor="middle" class="small">Local access only</text>
<text x="1190" y="112" class="label">Display currency</text>
<rect x="1190" y="121" width="160" height="42" rx="10" fill="#0c1425" stroke="#26324a"/>
<text x="1206" y="148" class="sub">Euro (EUR)</text>
<text x="1330" y="148" class="small">⌄</text>
<!-- Filters -->
<rect x="60" y="180" width="1320" height="142" rx="18" class="panel"/>
<text x="84" y="211" class="label">Withdrawal interval</text>
<rect x="84" y="224" width="344" height="42" rx="9" class="card"/>
<text x="100" y="251" class="sub">All activity</text><text x="402" y="251" class="small">⌄</text>
<text x="449" y="211" class="label">From</text>
<rect x="449" y="224" width="245" height="42" rx="9" class="card"/>
<text x="465" y="251" class="sub">01/06/2026, 00:00</text>
<text x="715" y="211" class="label">To</text>
<rect x="715" y="224" width="245" height="42" rx="9" class="card"/>
<text x="731" y="251" class="sub">27/10/2026, 14:20</text>
<rect x="985" y="224" width="158" height="42" rx="9" fill="#8bafff"/>
<text x="1064" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#081122">Load report</text>
<text x="84" y="296" class="small">Choose a withdrawal interval or custom date range. CSV is formatted for Parqet.</text>
<!-- Portfolio -->
<rect x="60" y="340" width="1320" height="190" rx="18" class="panel"/>
<text x="84" y="374" class="h2">Bot-tracked portfolio</text>
<g>
 <rect x="84" y="394" width="400" height="106" rx="14" class="card"/>
 <text x="104" y="423" class="label">Bot-tracked BTC</text><text x="104" y="466" class="value">0.01543210 BTC</text>
 <rect x="520" y="394" width="400" height="106" rx="14" class="card"/>
 <text x="540" y="423" class="label">Current BTC price</text><text x="540" y="466" class="value">€67,595.00 / BTC</text>
 <text x="540" y="488" class="small">Kraken public price page · fetched 14:20</text>
 <rect x="956" y="394" width="400" height="106" rx="14" class="card"/>
 <text x="976" y="423" class="label">Value in fiat currency</text><text x="976" y="466" class="value">€1,043.29</text>
</g>
<!-- Settings -->
<rect x="60" y="548" width="1320" height="252" rx="18" class="panel"/>
<text x="84" y="583" class="h2">Bot settings</text>
<g>
 <rect x="84" y="601" width="300" height="72" rx="12" class="card"/><text x="100" y="626" class="label">Exchange</text><text x="100" y="653" class="value" font-size="19">Kraken</text>
 <rect x="404" y="601" width="300" height="72" rx="12" class="card"/><text x="420" y="626" class="label">Quote currency</text><text x="420" y="653" class="value" font-size="19">EUR</text>
 <rect x="724" y="601" width="300" height="72" rx="12" class="card"/><text x="740" y="626" class="label">Trading mode</text><text x="740" y="653" class="value" font-size="19">Live</text>
 <rect x="1044" y="601" width="312" height="72" rx="12" class="card"/><text x="1060" y="626" class="label">Purchase amount</text><text x="1060" y="653" class="value" font-size="19">Exchange minimum</text>
 <rect x="84" y="687" width="300" height="72" rx="12" class="card"/><text x="100" y="712" class="label">Deposit day</text><text x="100" y="739" class="value" font-size="19">1</text>
 <rect x="404" y="687" width="300" height="72" rx="12" class="card"/><text x="420" y="712" class="label">Automatic withdrawals</text><text x="420" y="739" class="value" font-size="19">Enabled</text>
 <rect x="724" y="687" width="300" height="72" rx="12" class="card"/><text x="740" y="712" class="label">Withdrawal threshold</text><text x="740" y="739" class="value" font-size="19">€1,000.00</text>
 <rect x="1044" y="687" width="312" height="72" rx="12" class="card"/><text x="1060" y="712" class="label">Bitcoin</text><text x="1060" y="739" class="value" font-size="19">BTC</text>
</g>
<text x="84" y="782" class="small">Live prices shown for illustration only. All values below are fictional.</text>
<!-- Period -->
<rect x="60" y="818" width="1320" height="190" rx="18" class="panel"/>
<text x="84" y="853" class="h2">Selected period summary</text>
<g>
 <rect x="84" y="872" width="240" height="110" rx="12" class="card"/><text x="100" y="898" class="label">BTC purchases</text><text x="100" y="932" class="value" font-size="20">7 purchases</text><text x="100" y="957" class="small">0.00042000 BTC</text>
 <rect x="340" y="872" width="240" height="110" rx="12" class="card"/><text x="356" y="898" class="label">Purchase volume</text><text x="356" y="932" class="value" font-size="20">€28.25</text><text x="356" y="957" class="small">Average: €67,261 / BTC</text>
 <rect x="596" y="872" width="240" height="110" rx="12" class="card"/><text x="612" y="898" class="label">Trading fees</text><text x="612" y="932" class="value" font-size="20">€0.08</text>
 <rect x="852" y="872" width="240" height="110" rx="12" class="card"/><text x="868" y="898" class="label">Withdrawals</text><text x="868" y="932" class="value" font-size="20">0.00000000 BTC</text><text x="868" y="957" class="small">0 withdrawals</text>
 <rect x="1108" y="872" width="248" height="110" rx="12" class="card"/><text x="1124" y="898" class="label">Profit / loss</text><text x="1124" y="932" class="value green" font-size="20">+€0.06</text><text x="1124" y="957" class="small">Period purchases, current price</text>
</g>
<!-- Activity -->
<rect x="60" y="1026" width="1320" height="218" rx="18" class="panel"/>
<text x="84" y="1062" class="h2">Activity</text><text x="1270" y="1062" class="small">Entries per page: 20</text>
<text x="84" y="1093" class="label">DATE</text><text x="360" y="1093" class="label">TYPE</text><text x="650" y="1093" class="label">BTC</text><text x="840" y="1093" class="label">PRICE</text><text x="1050" y="1093" class="label">VALUE</text><text x="1220" y="1093" class="label">FEE</text>
<line x1="84" y1="1104" x2="1356" y2="1104" class="line"/>
<text x="84" y="1133" class="sub">27/10/2026, 12:30</text><text x="360" y="1133" class="sub">Buy</text><text x="650" y="1133" class="sub">0.00006000</text><text x="840" y="1133" class="sub">€67,180 / BTC</text><text x="1050" y="1133" class="sub">€4.03</text><text x="1220" y="1133" class="sub">€0.01</text>
<line x1="84" y1="1146" x2="1356" y2="1146" class="line"/>
<text x="84" y="1175" class="sub">20/10/2026, 12:30</text><text x="360" y="1175" class="sub">Buy</text><text x="650" y="1175" class="sub">0.00006000</text><text x="840" y="1175" class="sub">€67,240 / BTC</text><text x="1050" y="1175" class="sub">€4.03</text><text x="1220" y="1175" class="sub">€0.01</text>
<text x="1166" y="1230" class="small">Download Parqet CSV  ↓</text>
<rect x="24" y="24" width="1392" height="1252" rx="22" fill="none" stroke="#26324a" stroke-width="1.5"/>
<text x="84" y="1270" class="small">Illustrative dashboard · fictional data only</text>
</svg>
