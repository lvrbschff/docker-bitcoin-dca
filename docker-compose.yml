services:
  bitcoin-dca:
    build: .
    container_name: bitcoin-dca
    restart: unless-stopped
    # Configure the account, exchange and bot settings in the web UI.
    environment:
      WEB_UI_PORT: "${WEB_UI_PORT:-6890}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "${WEB_UI_PORT:-6890}:${WEB_UI_PORT:-6890}"
    volumes:
      - ./state:/data
      - bitcoin_dca_webui_data:/webui-data

volumes:
  bitcoin_dca_webui_data:
    name: bitcoin-dca-webui-data
