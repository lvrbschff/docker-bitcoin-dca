services:
  bitcoin-dca:
    build: .
    container_name: bitcoin-dca
    restart: unless-stopped
    environment:
      EXCHANGE: ${EXCHANGE:-KRAKEN}
      QUOTE_CURRENCY: EUR
      BASE_ASSET: BTC
      BUY_AMOUNT: "0"
      DEPOSIT_DAY: "1"
      FIRST_BUY_DELAY_SECONDS: "60"
      TIMEZONE: Europe/Berlin
      LIVE_TRADING: "false"
      CHECK_INTERVAL_SECONDS: "300"
      ORDER_STATUS_CHECK_SECONDS: "30"
      WITHDRAWALS_ENABLED: "false"
      WITHDRAW_THRESHOLD_QUOTE: "1000"
      WITHDRAW_ADDRESS: ${WITHDRAW_ADDRESS:-}
      WITHDRAW_NETWORK: ${WITHDRAW_NETWORK:-BTC}
      WEB_UI_ENABLED: "true"
      WEB_UI_PORT: "${WEB_UI_PORT:-6890}"
      WEB_UI_USERNAME: ${WEB_UI_USERNAME:-admin}
      WEB_UI_PASSWORD: ${WEB_UI_PASSWORD:-admin}
      BITVAVO_API_KEY: ${BITVAVO_API_KEY:-}
      BITVAVO_API_SECRET: ${BITVAVO_API_SECRET:-}
      KRAKEN_API_KEY: ${KRAKEN_API_KEY:-}
      KRAKEN_API_SECRET: ${KRAKEN_API_SECRET:-}
      KRAKEN_WITHDRAW_KEY: ${KRAKEN_WITHDRAW_KEY:-}
    ports:
      - "127.0.0.1:${WEB_UI_PORT:-6890}:${WEB_UI_PORT:-6890}"
    volumes:
      - ./state:/data
      - bitcoin_dca_webui_data:/webui-data

volumes:
  bitcoin_dca_webui_data:
    name: bitcoin-dca-webui-data
